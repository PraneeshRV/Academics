<!DOCTYPE html>
<html>
<head>
    <title>Fetch API Student Viewer</title>
</head>
<body>

<h2>Student Details (Fetch API)</h2>

<button onclick="loadStudents()">Load Students</button>

<div id="output"></div>

<script>

function loadStudents(){

fetch("students.php")

.then(response=>{

    if(!response.ok){
        throw new Error("Server Error");
    }

    return response.json();

})

.then(data=>{

    let table="<table border='1' cellpadding='8'>";

    table+="<tr>";
    table+="<th>Register No</th>";
    table+="<th>Name</th>";
    table+="<th>Department</th>";
    table+="<th>Semester</th>";
    table+="<th>CGPA</th>";
    table+="</tr>";

    data.forEach(student=>{

        table+="<tr>";
        table+="<td>"+student.registerNumber+"</td>";
        table+="<td>"+student.name+"</td>";
        table+="<td>"+student.department+"</td>";
        table+="<td>"+student.semester+"</td>";
        table+="<td>"+student.cgpa+"</td>";
        table+="</tr>";

    });

    table+="</table>";

    document.getElementById("output").innerHTML=table;

})

.catch(error=>{

    document.getElementById("output").innerHTML="<h3>Unable to retrieve student data.</h3>";

    console.log(error);

});

}

</script>

</body>
</html>
