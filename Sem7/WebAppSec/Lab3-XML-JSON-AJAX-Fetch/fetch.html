<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity 5 — Fetch API</title>
<style>
    :root { color-scheme: light; }
    body  { font-family: Arial, Helvetica, sans-serif; margin: 2rem;
            background: #fff; color: #111; }
    table { border-collapse: collapse; margin-top: 1rem; }
    th, td{ border: 1px solid #666; padding: 6px 12px; text-align: left; }
    th    { background: #eee; }
    .error{ color: #b00; font-weight: bold; }
</style>
</head>
<body>

<h2>Activity 5 — Student list loaded with the Fetch API</h2>

<button onclick="loadStudents()">Load Students</button>

<div id="output"></div>

<script>
function loadStudents() {

    fetch("students.php")

        .then(response => {
            // fetch() only rejects on a network failure, so HTTP error
            // codes such as 404 and 500 have to be checked by hand.
            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }
            return response.json();
        })

        .then(data => {

            let table = "<table>";
            table += "<tr><th>Register No</th><th>Name</th><th>Department</th>" +
                     "<th>Semester</th><th>CGPA</th></tr>";

            data.forEach(student => {
                table += "<tr>";
                table += "<td>" + student.registerNumber + "</td>";
                table += "<td>" + student.name + "</td>";
                table += "<td>" + student.department + "</td>";
                table += "<td>" + student.semester + "</td>";
                table += "<td>" + student.cgpa + "</td>";
                table += "</tr>";
            });

            table += "</table>";

            document.getElementById("output").innerHTML = table;
        })

        .catch(error => {
            document.getElementById("output").innerHTML =
                "<p class='error'>Unable to retrieve student data.</p>";
            console.error(error);
        });
}
</script>

</body>
</html>
