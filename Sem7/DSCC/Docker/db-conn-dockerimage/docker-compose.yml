# Standalone Lab 4. Host ports 8091 / 5433 so this can run at the same time as
# the combined stack (docker-compose.all.yml), which uses 8082 / 5432.
# Container ports are unchanged — only the host side moves. The app still
# reaches the DB as host "db" on 5432 over the compose network, never via the
# published port.
services:
  db:
    image: postgres:16
    container_name: testdb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: db-connector-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: secret
      DB_NAME: mydb
    ports:
      - "8091:8080"
